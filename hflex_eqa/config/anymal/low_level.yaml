---
low_level:
  type: LowLevelModule
  semantic_search:
    type: ClipSearch  # ClipSearch, QuestionRoomClipSearch, ClosestSearch
    similarity:
      type: cosine_similarity  # cosine_similarity | frontier_single_cosine_similarity | simple_cosine_similarity
      pooling_mode: average  # average | max
      weights_mode: exponential_decay  # uniform | linear_decay | exponential_decay
      exponential_decay_rate: 0.5
    search_layer: FRONTIERS
    nav_layer: TRAVERSABILITY  # 3D: PLACES, 2D: TRAVERSABILITY
    use_goal_orientation: true
    shortest_path:
      type: Dijkstra
      project_to_ground: false
      check_occupancy_grid: true
  planner:
    type: BSplinePlanner
    num_points_integration: 300
    interpolate_yaw_waypoints: true
    append_goal_yaw_rotation: false
    add_goal: false
    delta_distance: 0.05
  node_search:
    type: NodeSearch
    search_layer: FRONTIERS
    nav_layer: TRAVERSABILITY  # 3D: PLACES, 2D: TRAVERSABILITY
    use_goal_orientation: true
    shortest_path:
      type: Dijkstra
      project_to_ground: false
      check_occupancy_grid: true
  object_search:
    type: ObjectVpsSearch
    search_layer: FRONTIERS
    nav_layer: TRAVERSABILITY  # 3D: PLACES, 2D: TRAVERSABILITY
    use_goal_orientation: true
    shortest_path:
      type: Dijkstra
      project_to_ground: false
      check_occupancy_grid: true
    vp_selection:
      type: circle_2d
      num_angle_samples: 48
      top_n: 45
      min_angular_separation_degrees: 15
      num_radius_samples: 5
      radius_margin: 1.0
      coarse_to_fine_enabled: true
      coarse_to_fine_min_samples: 24
      coarse_stride: 6
      coarse_seed_count: 6
      coarse_refine_window: 3
      visibility_occlusion_weight: 0.7
      visibility_framing_weight: 0.3
      camera_config:
        fx: 643.976806640625
        fy: 643.2158813476562
        cx: 642.9476928710938
        cy: 362.4953918457031
        width: 1280
        height: 720
      visualize_score: false
    a_star_config:
      use_diagonal: false
      use_robot_clearance: true
      start_robot_clearance_radius_m: 0.2
      goal_robot_clearance_radius_m: 0.5
      use_initial_robot_pose_clearance: true
      initial_robot_pose_clearance_radius_m: 0.3
  find_room_search:
    type: FindRoomSearch
    alpha: 0.39
    beta: 0.59
    gamma: 0.02
    debug_log_scores: false
    similarity:
      type: cosine_similarity
      pooling_mode: max
      weights_mode: uniform
      exponential_decay_rate: 0.5
    search_layer: FRONTIERS
    nav_layer: TRAVERSABILITY  # 3D: PLACES, 2D: TRAVERSABILITY
    use_goal_orientation: true
    shortest_path:
      type: Dijkstra
      project_to_ground: false
      check_occupancy_grid: true
  a_star_config:
    use_diagonal: false
    use_robot_clearance: true
    start_robot_clearance_radius_m: 0.2
    goal_robot_clearance_radius_m: 0.5
    use_initial_robot_pose_clearance: true
    initial_robot_pose_clearance_radius_m: 0.3
  bounding_box:
    enabled: true
    min: [0.0, -10.0, -2.0]
    max: [30.0, 1.5, 3.0]
  simulation: false
  direct_goal_mode: false
  collision_avoidance_start: true
  collision_avoidance_goal: true
search_manager:
  type: EQAPlannerManagerModule
  frontier_blacklist_trans_tolerance: 4.0  # 0.4m
  frontier_blacklist_rot_tolerance: 20.0
  frontier_blacklist_use_position_radius: true
  frontier_blacklist_position_radius_m: 0.3
  progress_timeout_ns: 30000000000
  goal_reached_threshold_trans: 0.1
  goal_reached_threshold_angle: 10.0
  eqa_planner_callable: call_eqa_planner
  finish_callable: call_finish
  log_call: true
  triggered: true
  nav_layer: TRAVERSABILITY
  viewpoint_selection: true
  min_confidence: 0.85
