---
x-ros2-hflex_eqa-base: &ros2_hflex_eqa_base
  image: ros2:hflex-eqa-thor
  build:
    context: ${HFLEX_WS}
    dockerfile: src/hflex_eqa/docker/thor/Dockerfile
  network_mode: host
  ipc: host
  pid: host
  privileged: true
  runtime: nvidia
  working_dir: /developer/hflex_eqa_ws
  ulimits:
    memlock: -1
    stack: 67108864
  group_add: [dialout]
  devices: [/dev/ttyUSB_VN100:/dev/ttyUSB_VN100, /dev/ttyUSB0:/dev/ttyUSB0]
  environment:
    DISPLAY: ${DISPLAY}
    XAUTHORITY: /root/.Xauthority
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
    CYCLONEDDS_URI: file:///tmp/cyclonedds.xml
    COLCON_DEFAULTS_FILE: /developer/hflex_eqa_ws/colcon_defaults.yaml
    HF_HOME: /developer/hflex_eqa_ws/hf_cache
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    LLAMA_API_KEY: ${LLAMA_API_KEY:-}
    SEMANTIC_INFERENCE_MODEL_DIR: /developer/hflex_eqa_ws/models
    CLIP_CACHE_DIR: /developer/hflex_eqa_ws/.clip
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ${XAUTHORITY:-/tmp/.docker.xauth}:/root/.Xauthority:ro
    - ${HFLEX_WS}:/developer/hflex_eqa_ws
    - ../default/cyclonedds.xml:/tmp/cyclonedds.xml:ro
    - ${RESULTS_DIR}:/developer/results
    - ${BAGS_DIR}:/developer/bags
services:
  ros2_hflex_eqa:
    <<: *ros2_hflex_eqa_base
    container_name: hflex_eqa_thor
    stdin_open: true
    tty: true
    command: /bin/bash
  scene_graph:
    <<: *ros2_hflex_eqa_base
    container_name: hflex_eqa_scene_graph
    command: [/bin/bash, -lc, source install/setup.bash && exec ros2 launch hflex_eqa_ros scene_graph.launch.yaml]
  eqa:
    <<: *ros2_hflex_eqa_base
    container_name: hflex_eqa_planner
    command: [/bin/bash, -lc, source install/setup.bash && exec ros2 launch hflex_eqa_ros eqa.launch.yaml]
